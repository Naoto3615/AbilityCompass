{% extends "base.html" %}
{% load text_mode %}
{% block title %}{% t "実習記録を追加" %}{% endblock %}
{% block content %}
<h1 class="text-xl font-bold text-gray-700 mb-5">🏢 {% t "実習記録を追加" %}</h1>
<div class="card fade-in">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block font-bold text-gray-700 mb-1">{% t "実習先名" %}</label>
      <input type="text" name="company_name" required class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400" placeholder="○○農場">
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block font-bold text-gray-700 mb-1">{% t "実習日" %}</label>
        <input type="date" name="date" required class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400">
      </div>
      <div>
        <label class="block font-bold text-gray-700 mb-1">{% t "実習時間" %}</label>
        <input type="number" name="duration_hours" value="4" step="0.5" min="0.5" max="8" class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400">
      </div>
    </div>
    <div>
      <label class="block font-bold text-gray-700 mb-1">{% t "作業内容" %}</label>
      <textarea name="work_content" rows="2" required class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400"></textarea>
    </div>
    <div>
      <label class="block font-bold text-gray-700 mb-1">👍 {% t "良かったこと" %}</label>
      <textarea name="good_points" rows="2" class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400"></textarea>
    </div>
    <div>
      <label class="block font-bold text-gray-700 mb-1">💪 {% t "課題・気になったこと" %}</label>
      <textarea name="challenges" rows="2" class="w-full border-2 border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-green-400"></textarea>
    </div>
    <button type="submit" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl hover:bg-green-600 transition">
      ✅ {% t "記録する" %}
    </button>
  </form>
</div>
{% endblock %}
